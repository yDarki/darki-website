<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login · DonutSMP Stats</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="stylesheet" href="/theme.css?v=1" />
<link rel="stylesheet" href="/css/login.css?v=1" />
</head>
<body>
  <div class="bg"></div>
  <div class="wrap">
    <h1><img src="/favicon.svg" alt=""><span class="grad">DonutSMP Stats</span></h1>
    <p class="sub">Sign in with your Minecraft account to track players — or browse as a guest.</p>
    <div class="card">
      <div id="choose">
        <button class="btn primary" id="loginBtn">Login<span class="via">via Minecraft</span></button>
        <button class="btn ghost" id="guestBtn">Enter as guest</button>
      </div>
      <div class="step" id="step">
        <div class="lead">Send this message in Minecraft:</div>
        <div class="cmd">/msg <b id="collector">Vortex_xy</b> <b id="codeInline">…</b></div>
        <div class="code" id="code">••••••</div>
        <div class="waiting" id="waiting"><span class="spin"></span><span>Waiting for your whisper in Minecraft…</span></div>
        <div class="err" id="err"></div>
        <span class="cancel" id="cancel">Cancel</span>
      </div>
    </div>
    <div class="foot">The login only proves the account is yours. No password, no cost.</div>
  </div>
  <script src="/js/login.js?v=2" defer></script>
</body>
</html>
